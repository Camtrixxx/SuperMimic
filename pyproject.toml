[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "Humanoid whole-body motion tracking with one differentiable world model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mjlab[cu126]",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "viser>=1.0.24",
]

[project.scripts]
sm-train = "supermimic.scripts.train:main"
sm-train-velocity = "supermimic.scripts.train_velocity:cli"
sm-convert = "supermimic.data.convert:cli"
sm-bones-name-filter = "supermimic.data.bones_filter:cli"
sm-feasibility = "supermimic.data.feasibility:cli"
sm-bones-finalize = "supermimic.data.bones_finalize:cli"
sm-loco-library = "supermimic.data.loco_library:cli"
sm-eval = "supermimic.evaluation.tracking:cli"
sm-merge-eval = "supermimic.evaluation.merge:cli"
sm-summarize-evals = "supermimic.evaluation.summarize:cli"
sm-push-test = "supermimic.evaluation.push_test:cli"
sm-velocity-step-test = "supermimic.evaluation.velocity_step_test:cli"

[tool.uv.sources]
# HybridRobotics/mjlab_research, pinned to the commit all results were produced with.
mjlab = { git = "https://github.com/HybridRobotics/mjlab_research", rev = "dd51a9fcc98791a2f0b018b3c7f71a3eefd5ecdd" }

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]
# torch's stubs do not re-export most public functions (torch.cat, torch.where, ...).
reportPrivateImportUsage = false

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

# repro: NVIDIA's CUDA-12 build of warp-lang. PyPI warp-lang>=1.18 is built with
# CUDA 13.4 and needs driver R580+; this wheel needs only R525+ and also works on
# newer drivers. Linux x86_64 only.
[tool.uv]
override-dependencies = [
  "warp-lang==1.19.0+cu12 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "warp-lang>=1.15.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[tool.uv.sources.warp-lang]
url = "https://github.com/NVIDIA/warp/releases/download/v1.19.0/warp_lang-1.19.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl"
marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"
